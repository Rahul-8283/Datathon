version: '3.8'

services:
  # 1. The FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datathon-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    # The Dockerfile already runs uvicorn with --reload, but we can be explicit
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # 2. The Celery Worker (using the same backend image)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datathon-celery-worker
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    command: celery -A core.celery_app worker --loglevel=info
    depends_on:
      - backend

  # 3. The React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datathon-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevent overwriting the container's node_modules
    env_file:
      - ./frontend/.env
    # The Dockerfile already runs npm run dev, we just need to ensure it binds to 0.0.0.0
    command: npm run dev -- --host 0.0.0.0
